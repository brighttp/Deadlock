# Database PostgreSQL sekali pakai khusus test (phpunit.pgsql.xml). Tidak menyimpan data (tmpfs).
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deadlock_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
